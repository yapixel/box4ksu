name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-musl
            arch: arm64
          - target: x86_64-linux-musl
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Zig
        run: |
          ZIG_VER="0.13.0"
          curl -sSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" | tar -xJ -C /tmp
          echo "/tmp/zig-linux-x86_64-${ZIG_VER}" >> $GITHUB_PATH

      - name: Build static binary (${{ matrix.arch }})
        run: |
          zig cc -Wall -Wextra -O2 -target ${{ matrix.target }} -static -Wl,-s -o box-${{ matrix.arch }} box.c
          file box-${{ matrix.arch }}
          ls -lh box-${{ matrix.arch }}

      - name: Upload build artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: box-${{ matrix.arch }}
          path: box-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "box-*" -exec cp {} release-assets/ \;
          cp box.ini release-assets/
          cp box-service.sh release-assets/
          cd release-assets
          sha256sum * > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="nightly"
          fi
          gh release create "$TAG_NAME" release-assets/* \
            --title "Release ${TAG_NAME}" \
            --generate-notes \
            --notes-start-tag "" \
            || gh release upload "$TAG_NAME" release-assets/* --clobber
