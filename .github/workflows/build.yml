name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-musl
            arch: arm64
          - target: x86_64-linux-musl
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build static binary (${{ matrix.arch }})
        run: |
          zig cc -Wall -Wextra -O2 -target ${{ matrix.target }} -static -Wl,-s -o box-${{ matrix.arch }} box.c
          file box-${{ matrix.arch }}
          ls -lh box-${{ matrix.arch }}

      - name: Upload build artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: box-${{ matrix.arch }}
          path: box-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "box-*" -exec cp {} release-assets/ \;
          cp box.ini release-assets/
          cp box-service.sh release-assets/
          cd release-assets
          sha256sum * > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
