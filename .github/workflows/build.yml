name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (aarch64-linux-android, bionic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate Android NDK
        run: |
          MIN_API="26"
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_DIR="$ANDROID_NDK_ROOT"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME/ndk"/* | tail -n 1)
          else
            echo "Error: Android NDK directory not found" >&2
            exit 1
          fi
          echo "Using Android NDK: ${NDK_DIR}"
          CC="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${MIN_API}-clang"
          if [ ! -x "$CC" ]; then
            echo "Error: Compiler ${CC} not found or not executable" >&2
            exit 1
          fi
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${CC}" >> $GITHUB_ENV

      - name: Install Rust target
        run: rustup target add aarch64-linux-android

      - name: Run unit tests
        run: cargo test

      - name: Build binary and package tarball
        run: |
          # Bionic (not static musl): only Android's libc reads Android's timezone data
          cargo build --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/box box
          chmod 755 box
          echo "=== file ==="
          file box
          echo "=== readelf -h ==="
          readelf -h box
          echo "=== readelf -l ==="
          readelf -l box
          echo "=== readelf -d ==="
          readelf -d box
          echo "=== size ==="
          size box
          echo "=== sha256sum ==="
          sha256sum box

          # Package tarball where internal files are strictly box, box.ini, box-service.sh
          mkdir -p pkg
          cp box box.ini box-service.sh pkg/
          chmod 755 pkg/box pkg/box-service.sh
          (cd pkg && tar -czf ../box-arm64.tar.gz box box.ini box-service.sh)
          rm -rf pkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: box-arm64
          path: box-arm64.tar.gz

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" release-assets/* \
            --title "Release ${TAG_NAME}" \
            --generate-notes \
            --notes-start-tag "" \
            || gh release upload "$TAG_NAME" release-assets/* --clobber
