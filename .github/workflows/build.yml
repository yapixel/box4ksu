name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-musl
            arch: arm64
          - target: x86_64-linux-musl
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Tools (Zig & UPX)
        run: |
          ZIG_VER="0.13.0"
          curl -sSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" | tar -xJ -C /tmp
          echo "/tmp/zig-linux-x86_64-${ZIG_VER}" >> $GITHUB_PATH

          sudo apt-get update && sudo apt-get install -y upx

      - name: Build static binary and package tarball (${{ matrix.arch }})
        run: |
          # 1. Compile static binary strictly named 'box'
          zig cc -Wall -Wextra -Oz -flto -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident -target ${{ matrix.target }} -static -Wl,-s -Wl,--gc-sections -Wl,--build-id=none -o box box.c
          file box
          echo "Original binary size:"
          ls -lh box

          # 2. Compress binary with UPX (reduces to ~25KB - 30KB)
          upx --best --lzma box || true
          echo "Compressed binary size:"
          ls -lh box

          # 3. Package tarball where internal files are strictly box, box.ini, box-service.sh
          mkdir -p pkg
          cp box pkg/
          cp box.ini pkg/
          cp box-service.sh pkg/
          chmod 755 pkg/box pkg/box-service.sh

          (cd pkg && tar -czf ../box-${{ matrix.arch }}.tar.gz box box.ini box-service.sh)
          rm -rf pkg

      - name: Upload build artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: box-${{ matrix.arch }}
          path: box-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="nightly"
          fi
          gh release create "$TAG_NAME" release-assets/* \
            --title "Release ${TAG_NAME}" \
            --generate-notes \
            --notes-start-tag "" \
            || gh release upload "$TAG_NAME" release-assets/* --clobber
