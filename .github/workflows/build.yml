name: Build and Release

on:
  push:
    branches: [ "main", "master", "dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-musl
            arch: arm64
          - target: x86_64-linux-musl
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Zig
        run: |
          ZIG_VER="0.13.0"
          curl -sSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" | tar -xJ -C /tmp
          echo "/tmp/zig-linux-x86_64-${ZIG_VER}" >> $GITHUB_PATH

      - name: Build static binary and package tarball (${{ matrix.arch }})
        run: |
          # 1. Compile native pure static binary
          zig cc -Wall -Wextra -Oz -flto -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident -target ${{ matrix.target }} -static -Wl,-s -Wl,--gc-sections -Wl,--build-id=none -o box box.c
          chmod 755 box
          echo "=== file ==="
          file box
          echo "=== readelf -h ==="
          readelf -h box || true
          echo "=== readelf -l ==="
          readelf -l box || true
          echo "=== readelf -d ==="
          readelf -d box || true
          echo "=== size ==="
          size box || true
          echo "=== sha256sum ==="
          sha256sum box

          # 2. Package tarball where internal files are strictly box, box.ini, box-service.sh
          mkdir -p pkg
          cp box pkg/
          cp box.ini pkg/
          cp box-service.sh pkg/
          chmod 755 pkg/box pkg/box-service.sh

          (cd pkg && tar -czf ../box-${{ matrix.arch }}.tar.gz box box.ini box-service.sh)
          rm -rf pkg

      - name: Upload build artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: box-${{ matrix.arch }}
          path: box-${{ matrix.arch }}.tar.gz

      - name: Upload musl static binary
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: box-musl-static
          path: box

  bionic-build:
    name: build (aarch64-linux-android, bionic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate Android NDK
        run: |
          MIN_API="26"
          echo "MIN_API=${MIN_API}" >> $GITHUB_ENV
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_DIR="$ANDROID_NDK_ROOT"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME/ndk"/* | tail -n 1)
          else
            echo "Error: Android NDK directory not found" >&2
            exit 1
          fi
          echo "Using Android NDK: ${NDK_DIR}"
          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"
          CC="${TOOLCHAIN}/bin/aarch64-linux-android${MIN_API}-clang"
          if [ ! -x "$CC" ]; then
            echo "Error: Compiler ${CC} not found or not executable" >&2
            exit 1
          fi
          echo "NDK_DIR=${NDK_DIR}" >> $GITHUB_ENV
          echo "TOOLCHAIN=${TOOLCHAIN}" >> $GITHUB_ENV
          echo "CC=${CC}" >> $GITHUB_ENV

      - name: Build Android Bionic binary
        run: |
          $CC -Wall -Wextra -Wpedantic -Oz -o box box.c
          chmod 755 box
          cp box box-bionic

          echo "=== file ==="
          file box
          echo "=== readelf -h ==="
          readelf -h box
          echo "=== readelf -l ==="
          readelf -l box
          echo "=== readelf -d ==="
          readelf -d box
          echo "=== size ==="
          size box
          echo "=== sha256sum ==="
          sha256sum box

      - name: Upload Android Bionic binary
        uses: actions/upload-artifact@v7
        with:
          name: box-android-bionic
          path: |
            box
            box-bionic

  release:
    needs: [build, bionic-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" release-assets/* \
            --title "Release ${TAG_NAME}" \
            --generate-notes \
            --notes-start-tag "" \
            || gh release upload "$TAG_NAME" release-assets/* --clobber
