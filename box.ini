# box.ini - sing-box service configuration file

[box]
SERVICE_NAME="sing-box"          # Service Name
WORK_DIR="/data/adb/sing-box"    # Working Directory
RUN_USER="root:net_admin"        # Running User:Group
MAX_LOG_SIZE=1048576             # Log rotation threshold (1MB)
STOP_TIMEOUT=10                  # Stop timeout (seconds)
START_TIMEOUT=3                  # Start verification time (seconds)
CHECK_CONFIG=0                   # Pre-start config validation (1=enabled)
NOFILE_LIMIT=1000000             # Open file descriptors limit
